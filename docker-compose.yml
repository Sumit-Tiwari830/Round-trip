version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: roundtrip-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: roundtrip
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./roundtrip-backend
      dockerfile: Dockerfile
    container_name: roundtrip-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/roundtrip
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./roundtrip-frontend
      dockerfile: Dockerfile
    container_name: roundtrip-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: http://localhost:8080/ws-roundtrip
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    depends_on:
      - backend

volumes:
  mongo-data:
